name: Nix build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kbuildx:
    name: kbuildx (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build kbuildx
        run: nix build ".#packages.${{ matrix.system }}.kbuildx" --print-build-logs

      - name: Verify packaged CLI
        run: ./result/bin/kbuildx --version
