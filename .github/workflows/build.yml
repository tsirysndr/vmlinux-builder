name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Kernel version to build (e.g. 6.17.7, 6.16.y). Ignored when a custom repo is provided."
        required: false
        default: "6.17.7"
      repo:
        description: "Optional custom kernel git repo URL (e.g. https://github.com/tsirysndr/linux-orangepi)"
        required: false
        default: ""
      branch:
        description: "Branch or tag to check out in the custom repo (e.g. orange-pi-6.6-sun60iw2). Required when repo is set."
        required: false
        default: ""
      version:
        description: "Optional label used to name the vmlinux artifact when building from a custom repo."
        required: false
        default: ""
      config:
        description: "Optional existing config to merge with the default config (your config overrides; default only fills gaps). A file at the kernel tree root (e.g. config-6.6.98-sun60iw2) or an http(s) URL."
        required: false
        default: ""
      defconfig:
        description: "Optional board defconfig target for BSP builds (e.g. sun60iw2_defconfig). Runs `make <defconfig>` as the base so board essentials win; the default config is layered underneath and CONFIG_WERROR is disabled."
        required: false
        default: ""
      arch:
        description: "Architecture to build. 'both' builds x86_64 and aarch64 in parallel."
        required: false
        default: both
        type: choice
        options:
          - both
          - x86_64
          - aarch64
      initrd:
        description: "Also generate an initrd (and a U-Boot uInitrd on arm64)."
        required: false
        default: false
        type: boolean

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set
        shell: bash
        env:
          # Empty for push/PR -> falls through to the 'both' default.
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          case "$ARCH" in
            x86_64)  MATRIX='{"os":["ubuntu-latest"]}' ;;
            aarch64) MATRIX='{"os":["ubuntu-24.04-arm"]}' ;;
            *)       MATRIX='{"os":["ubuntu-latest","ubuntu-24.04-arm"]}' ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  compile:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Set TAG and VERSION
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_REPO: ${{ github.event.inputs.repo }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_CONFIG: ${{ github.event.inputs.config }}
          INPUT_DEFCONFIG: ${{ github.event.inputs.defconfig }}
          INPUT_INITRD: ${{ github.event.inputs.initrd }}
        run: |
          REPO="${INPUT_REPO}"
          BRANCH="${INPUT_BRANCH}"
          TAG="${INPUT_TAG:-6.17.7}"

          echo "MERGE_CONFIG=${INPUT_CONFIG}" >> "$GITHUB_ENV"
          echo "DEFCONFIG=${INPUT_DEFCONFIG}" >> "$GITHUB_ENV"
          echo "GEN_INITRD=${INPUT_INITRD}" >> "$GITHUB_ENV"

          if [[ -n "$REPO" ]]; then
            if [[ -z "$BRANCH" ]]; then
              echo "::error::'branch' is required when 'repo' is provided"
              exit 1
            fi

            # Version label for naming: input override, else sanitized branch name
            if [[ -n "$INPUT_VERSION" ]]; then
              VERSION="$INPUT_VERSION"
            else
              VERSION="$(echo "$BRANCH" | sed 's/[^A-Za-z0-9._-]\+/-/g')"
            fi

            echo "REPO=$REPO" >> "$GITHUB_ENV"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          else
            # VERSION=6.16 for 6.16.y, otherwise keep full tag (e.g. 6.16.2)
            if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.y$ ]]; then
              VERSION="${TAG%.y}"
            else
              VERSION="$TAG"
            fi

            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CPU_ARCH=$(uname -m)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          EXTRA_ARGS=()
          if [[ -n "$DEFCONFIG" ]]; then
            EXTRA_ARGS+=(--defconfig "$DEFCONFIG")
          fi
          if [[ -n "$MERGE_CONFIG" ]]; then
            EXTRA_ARGS+=(--merge-config "$MERGE_CONFIG")
          fi
          if [[ "$GEN_INITRD" == "true" ]]; then
            EXTRA_ARGS+=(--initrd)
          fi

          if [[ -n "$REPO" ]]; then
            ./build.ts --repo "$REPO" --branch "$BRANCH" --version "$VERSION" "${EXTRA_ARGS[@]}"
          else
            ./build.ts "$TAG" "${EXTRA_ARGS[@]}"
          fi
          sha256sum linux-stable/vmlinux-${{ env.VERSION }}.${{ env.CPU_ARCH }} > linux-stable/vmlinux-${{ env.VERSION }}.${{ env.CPU_ARCH }}.sha256

      - name: Generate uImage (arm64 only)
        if: env.CPU_ARCH == 'aarch64'
        working-directory: linux-stable
        run: |
          sudo apt-get update
          sudo apt-get install -y u-boot-tools

          # Build the arm64 boot Image (native build, no cross toolchain needed)
          make Image -j"$(nproc)"

          gzip -9 -k arch/arm64/boot/Image        # optional compression

          # Use the tree's own release string for the image name
          KREL="$(make -s kernelrelease)"
          mkimage -A arm64 -O linux -T kernel -C gzip \
              -a 0x40080000 -e 0x40080000 \
              -n "Linux ${KREL}" \
              -d arch/arm64/boot/Image.gz uImage

          sha256sum uImage > uImage.sha256

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: vmlinux-${{ env.VERSION }}.${{ env.CPU_ARCH }}
          path: |
            linux-stable/vmlinux-${{ env.VERSION }}.${{ env.CPU_ARCH }}
            linux-stable/vmlinux-${{ env.VERSION }}.${{ env.CPU_ARCH }}.sha256

      - name: Upload uImage (arm64 only)
        if: github.event_name == 'workflow_dispatch' && env.CPU_ARCH == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: uImage-${{ env.VERSION }}.${{ env.CPU_ARCH }}
          path: |
            linux-stable/uImage
            linux-stable/uImage.sha256

      - name: Upload initrd
        if: github.event_name == 'workflow_dispatch' && env.GEN_INITRD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: initrd-${{ env.VERSION }}.${{ env.CPU_ARCH }}
          if-no-files-found: warn
          path: |
            linux-stable/initrd.img-*
            linux-stable/uInitrd
