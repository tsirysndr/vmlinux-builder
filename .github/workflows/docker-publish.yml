name: ci
on:
  push:
    tags:
      - "*"
      - "!kbuildx-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish"
        type: "string"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Log in to Docker
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Write Github Token to file
        run: echo $GITHUB_TOKEN > .github_token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: fluentci-io/setup-fluentci@next

      # Docker Build Cloud: the builder is created on this runner first (the
      # buildx module's former `build_cloud` did that itself; today's module
      # exposes plain `build` with `--builder`). The cloud driver names it
      # `cloud-<org>-<name>`.
      - name: Create the Build Cloud builder
        run: docker buildx create --driver cloud tsiry/rockbox-builder || true

      - name: Build and Publish image to Docker Hub
        shell: bash
        run: >-
          fluentci run buildx build
          --run-dir "$RUNNER_TEMP/buildx-run"
          --builder cloud-tsiry-rockbox-builder
          --platform linux/amd64,linux/arm64
          --tag tsiry/vmlinux-builder:latest
          --build-arg "GITHUB_TOKEN=${GITHUB_ACCESS_TOKEN},TAG=${TAG}"
          --push true
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Log in to Github Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Github Container Registry
        run: |
          docker pull tsiry/vmlinux-builder:latest
          docker tag tsiry/vmlinux-builder:latest ghcr.io/tsirysndr/vmlinux-builder:latest
          docker push ghcr.io/tsirysndr/vmlinux-builder:latest
