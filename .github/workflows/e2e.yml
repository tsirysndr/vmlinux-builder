name: End-to-end tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Build and test CLI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          set -eux
          test -e /dev/kvm || { echo "no /dev/kvm on this runner"; exit 1; }
          # Give the runner user access to /dev/kvm (default is root:kvm 0660).
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm

      # PVH boots the guest with paging OFF. On Intel *without* VMX unrestricted
      # guest (common on nested KVM), the host can't virtualize CR0.PG=0 and the
      # guest triple-faults — which is what NetBSD MICROVM is hitting. Log it.
      - name: KVM virtualization capabilities
        run: |
          set -eux
          grep -m1 "model name" /proc/cpuinfo
          grep -qm1 hypervisor /proc/cpuinfo && echo "nested (runs under a hypervisor)" || echo "bare metal"
          grep -ochm1 -e vmx -e svm /proc/cpuinfo || true
          echo -n "kvm_intel unrestricted_guest: "; cat /sys/module/kvm_intel/parameters/unrestricted_guest 2>/dev/null || echo "(kvm_intel not loaded)"
          echo -n "kvm_intel nested: "; cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || echo n/a
          echo -n "kvm_amd nested: ";   cat /sys/module/kvm_amd/parameters/nested   2>/dev/null || echo n/a

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install bsdkrun CLI
        run: npm install -g @bsdkrun/cli

      - name: Verify bsdkrun runtime
        run: bsdkrun probe

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kbuildx -> target

      - name: Build kbuildx CLI
        run: cargo build --release --locked
        working-directory: ./kbuildx

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: ./kbuildx

      - name: Test build options
        shell: bash
        run: |
          set -o pipefail
          ./target/release/kbuildx build --help | tee /tmp/kbuildx-build-help.txt
          grep -F -- '--merge-config' /tmp/kbuildx-build-help.txt
          grep -F -- '--defconfig' /tmp/kbuildx-build-help.txt
          grep -F -- '--initrd' /tmp/kbuildx-build-help.txt
          grep -F -- '--modules' /tmp/kbuildx-build-help.txt
          grep -F -- '--uimage' /tmp/kbuildx-build-help.txt
          grep -F -- '--cpus' /tmp/kbuildx-build-help.txt
          grep -F -- '--memory' /tmp/kbuildx-build-help.txt
        working-directory: ./kbuildx

      - name: Test version listing
        run: ./target/release/kbuildx ls --refresh
        working-directory: ./kbuildx

      - name: Test full kernel build
        shell: bash
        run: |
          # On Linux, bsdkrun's virtio-fs backend pins one O_PATH descriptor
          # per inode. The kernel tree exceeds the runner's 65K hard limit, so
          # use privilege to raise both limits for kbuildx and its VM process.
          fd_limit="$(cat /proc/sys/fs/nr_open)"
          sudo prlimit --pid "$$" --nofile="$fd_limit:$fd_limit"
          echo "File descriptor limit: $(ulimit -n)"
          echo "bsdkrun binary: $(command -v bsdkrun)"
          host_memory_mib="$(awk '/MemTotal/ { print int($2 / 1024) }' /proc/meminfo)"
          echo "Sandbox resources: $(nproc) vCPU, ${host_memory_mib} MiB"
          ./target/release/kbuildx build 7.1.8 \
            --cpus "$(nproc)" \
            --memory "$host_memory_mib"
        working-directory: ./kbuildx
