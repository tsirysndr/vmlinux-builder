name: kbuildx release

on:
  push:
    tags:
      - "kbuildx-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: kbuildx -> target
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
        working-directory: ./kbuildx

      - name: Package release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          mkdir -p package
          cp "kbuildx/target/${TARGET}/release/kbuildx" package/kbuildx
          tar -C package -czf "$archive" kbuildx
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: kbuildx-${{ matrix.target }}
          path: |
            kbuildx-*.tar.gz
            kbuildx-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kbuildx-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
